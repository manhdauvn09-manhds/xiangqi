# Nginx configuration for xiangqi.games-core.com
# Place this in: /etc/nginx/sites-available/xiangqi.games-core.com
# Then symlink: ln -s /etc/nginx/sites-available/xiangqi.games-core.com /etc/nginx/sites-enabled/
# Based on existing server setup (allin1site.com pattern)

upstream xiangqi_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name xiangqi.games-core.com www.xiangqi.games-core.com;
    return 301 https://$host$request_uri;
}

# HTTPS (SSL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xiangqi.games-core.com www.xiangqi.games-core.com;

    # SSL certificates (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/xiangqi.games-core.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiangqi.games-core.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/xiangqi.games-core.com.access.log;
    error_log  /var/log/nginx/xiangqi.games-core.com.error.log;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://xiangqi.games-core.com https://accounts.google.com https://apis.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_min_length 1000;
    gzip_vary on;

    client_max_body_size 10M;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Serve static frontend files from Docker volume
    location / {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_cache_bypass                 $http_upgrade;
    }

    # Cache static assets (must be separate location block after / block)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to FastAPI backend
    location /api/ {
        # Rate limiting
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://xiangqi_api/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Keep-alive
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Auth endpoints with stricter rate limiting
    location /api/auth/ {
        # Strict rate limiting for auth
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://xiangqi_api/api/auth/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket proxy (/ws endpoint)
    location /ws {
        proxy_pass http://xiangqi_api/ws;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Long-lived connection timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 7d;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
