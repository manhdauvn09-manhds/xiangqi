# Nginx configuration for xiangqi.games-core.com
# Place this in: /etc/nginx/sites-available/xiangqi.games-core.com
# Then symlink: ln -s /etc/nginx/sites-available/xiangqi.games-core.com /etc/nginx/sites-enabled/

upstream xiangqi_api {
    server localhost:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name xiangqi.games-core.com;

    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name xiangqi.games-core.com;

    # SSL certificates (via Certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/xiangqi.games-core.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiangqi.games-core.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;
    gzip_min_length 1000;

    # Serve static frontend files
    location / {
        root /app/fe;
        index index.html;
        try_files $uri /index.html;  # SPA routing

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy to FastAPI backend
    location /api/ {
        proxy_pass http://xiangqi_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://xiangqi_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
