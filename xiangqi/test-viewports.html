<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><title>Viewport test — Xiangqi</title>
<style>
  body { background:#0a0e1a; color:#e9ecef; margin:0; padding:14px; font-family: sans-serif; }
  h1 { font-size:16px; margin:0 0 10px; }
  .row { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .vp { background:#131a2b; border:1px solid #2a3550; border-radius:10px; overflow:hidden; }
  .vp h2 { font-size:12px; padding:6px 10px; margin:0; background:#1c2540; color:#f4c430; }
  .vp iframe { border:0; display:block; background:#0a0e1a; }
</style></head>
<body>
<h1>Cờ Tướng Vương — Responsive viewport check</h1>
<div class="row">
  <div class="vp"><h2>📱 Mobile · 390 × 720</h2>
    <iframe src="/games/xiangqi/#/play" width="390" height="720"></iframe>
  </div>
  <div class="vp"><h2>📱 iPad · 820 × 720</h2>
    <iframe src="/games/xiangqi/#/play" width="820" height="720"></iframe>
  </div>
</div>
<script>
  // Bootstrap each iframe with a pending game so it goes to /play view
  setTimeout(() => {
    document.querySelectorAll('iframe').forEach(f => {
      try {
        f.contentWindow.sessionStorage.setItem('xq_pending_game', JSON.stringify({mode:'bot',botLevel:3,userSide:'r'}));
        f.contentWindow.location.reload();
      } catch (e) { console.warn(e); }
    });
  }, 500);
</script>
</body></html>
