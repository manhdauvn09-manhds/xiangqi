# Cờ Tướng Vương — Nginx config
# Serves static frontend + reverse-proxies API + WebSocket

upstream xq_api {
    server api:8787;
}

server {
    listen 80 default_server;
    server_name _;

    # Log format for debugging
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Note: Behind Cloudflare CDN — HTTPS enforced at edge
    # Origin receives HTTP from Cloudflare tunnel

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xiangqi.games-core.com; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Root location - serve game
    location / {
        alias /usr/share/nginx/html/games/xiangqi/;
        try_files $uri $uri/ /index.html;

        # HTML: no-cache
        location ~* \.html?$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|svg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Static frontend files (legacy path for backward compatibility)
    location /games/xiangqi/ {
        alias /usr/share/nginx/html/games/xiangqi/;
        try_files $uri $uri/ /games/xiangqi/index.html;

        # HTML: no-cache (always revalidate)
        location ~* \.html?$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Cache static assets (immutable)
        location ~* \.(js|css|png|jpg|svg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API endpoints
    location /api/ {
        proxy_pass http://xq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting (nginx level)
        limit_req zone=api burst=20 nodelay;
    }

    # WebSocket
    location /ws {
        proxy_pass http://xq_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check
    location /healthz {
        proxy_pass http://xq_api;
    }
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
