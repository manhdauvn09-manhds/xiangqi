<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Board container -->
  <rect x="150" y="65" width="500" height="500" fill="#d4a574" rx="20"/>

  <!-- Board grid (9x10) -->
  <g stroke="#4a4a4a" stroke-width="2">
    <!-- Vertical lines -->
    <line x1="180" y1="95" x2="180" y2="535" />
    <line x1="233" y1="95" x2="233" y2="535" />
    <line x1="286" y1="95" x2="286" y2="535" />
    <line x1="339" y1="95" x2="339" y2="535" />
    <line x1="392" y1="95" x2="392" y2="535" />
    <line x1="445" y1="95" x2="445" y2="535" />
    <line x1="498" y1="95" x2="498" y2="535" />
    <line x1="551" y1="95" x2="551" y2="535" />
    <line x1="604" y1="95" x2="604" y2="535" />

    <!-- Horizontal lines -->
    <line x1="150" y1="125" x2="650" y2="125" />
    <line x1="150" y1="155" x2="650" y2="155" />
    <line x1="150" y1="185" x2="650" y2="185" />
    <line x1="150" y1="215" x2="650" y2="215" />
    <line x1="150" y1="245" x2="650" y2="245" />
    <line x1="150" y1="305" x2="650" y2="305" />
    <line x1="150" y1="335" x2="650" y2="335" />
    <line x1="150" y1="365" x2="650" y2="365" />
    <line x1="150" y1="395" x2="650" y2="395" />
    <line x1="150" y1="425" x2="650" y2="425" />
    <line x1="150" y1="455" x2="650" y2="455" />
    <line x1="150" y1="485" x2="650" y2="485" />
    <line x1="150" y1="515" x2="650" y2="515" />
  </g>

  <!-- River label -->
  <text x="400" y="280" font-family="Georgia, serif" font-size="48" font-style="italic" fill="#c9a574" opacity="0.5" text-anchor="middle">楚河</text>
  <text x="400" y="325" font-family="Georgia, serif" font-size="48" font-style="italic" fill="#c9a574" opacity="0.5" text-anchor="middle">漢界</text>

  <!-- Sample pieces (Red) -->
  <circle cx="180" cy="95" r="18" fill="#dc3545" stroke="#8b2a2a" stroke-width="2"/>
  <text x="180" y="104" font-family="serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">馬</text>

  <circle cx="286" cy="95" r="18" fill="#dc3545" stroke="#8b2a2a" stroke-width="2"/>
  <text x="286" y="104" font-family="serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">象</text>

  <!-- Sample pieces (Black) -->
  <circle cx="604" cy="535" r="18" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
  <text x="604" y="544" font-family="serif" font-size="24" font-weight="bold" fill="#06d6a0" text-anchor="middle" dominant-baseline="middle">馬</text>

  <circle cx="498" cy="535" r="18" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
  <text x="498" y="544" font-family="serif" font-size="24" font-weight="bold" fill="#06d6a0" text-anchor="middle" dominant-baseline="middle">象</text>

  <!-- Title -->
  <text x="750" y="150" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#06d6a0">
    象棋
  </text>
  <text x="750" y="230" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">
    Cờ Tướng Vương
  </text>

  <!-- Subtitle -->
  <text x="750" y="290" font-family="Arial, sans-serif" font-size="28" fill="#b0b0b0">
    Play Xiangqi Online
  </text>
  <text x="750" y="330" font-family="Arial, sans-serif" font-size="22" fill="#888">
    AI • Multiplayer • ELO Ranking
  </text>

  <!-- Decorative elements -->
  <circle cx="800" cy="420" r="60" fill="#06d6a0" opacity="0.1"/>
  <circle cx="900" cy="480" r="40" fill="#dc3545" opacity="0.1"/>
</svg>
