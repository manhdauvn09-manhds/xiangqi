name: Phase 1 — Lint, Build, Test, Deploy

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'xiangqi/package-lock.json'

      - name: Install dependencies
        run: cd xiangqi && npm ci

      - name: ESLint check
        run: cd xiangqi && npm run lint:js || true

      - name: Accessibility audit
        run: cd xiangqi && npm run audit:a11y || true

  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'xiangqi/package-lock.json'

      - name: Install dependencies
        run: cd xiangqi && npm ci

      - name: Build with Vite
        run: cd xiangqi && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: xiangqi/dist/
          retention-days: 3

      - name: Check bundle size
        run: |
          cd xiangqi/dist
          echo "=== Bundle Size Report ==="
          du -sh .
          find . -name '*.js' -o -name '*.css' | head -10

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd api-xiangqi
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: cd api-xiangqi && python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./api-xiangqi/coverage.xml
          fail_ci_if_error: false

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: Check code formatting (black)
        run: cd api-xiangqi && black app/ --check || true

      - name: Check import sorting (isort)
        run: cd api-xiangqi && isort app/ --check-only || true

      - name: Flake8 linting
        run: cd api-xiangqi && flake8 app/ --max-line-length=120 --exclude=venv || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Bandit security scan
        run: |
          pip install bandit
          cd api-xiangqi && bandit -r app/ --skip B101 || true

  web-vitals:
    name: Web Vitals Check
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: xiangqi/dist/

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Run Lighthouse
        run: |
          cd xiangqi
          lighthouse http://localhost:5173 --chrome-flags='--headless' --output=json > lighthouse-report.json || true
          cat lighthouse-report.json | head -50

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: xiangqi/lighthouse-report.json
          retention-days: 7

  docker-build:
    name: Docker Build (Phase 1)
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.phase1
          push: false
          tags: xiangqi:phase1-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-build, backend-test, backend-lint, security-scan]
    if: always()
    steps:
      - name: Check if all jobs passed
        run: |
          if [ "${{ needs.frontend-lint.result }}" != "success" ]; then
            echo "Frontend lint failed"
            exit 1
          fi
          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "Frontend build failed"
            exit 1
          fi
          if [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          echo "All critical checks passed ✅"
