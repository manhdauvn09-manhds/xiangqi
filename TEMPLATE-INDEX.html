<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Framed Layout Template</title>

  <!-- Import the layout CSS template -->
  <link rel="stylesheet" href="TEMPLATE-LAYOUT.css">

  <!-- Your project-specific CSS here -->
  <style>
    header {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <!-- Container wraps all content with framed layout -->
  <div class="app-container">

    <!-- Header -->
    <header>
      <h1>Your Project Title</h1>
    </header>

    <!-- Main content -->
    <main>
      <section>
        <h2>Content Area</h2>
        <p>Your content goes here. Background will automatically toggle between light and dark themes.</p>
        <p>Outer margins stay light gray (light gray background visible on wide screens).</p>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; Your Project · Built with Framed Layout</p>
    </footer>

  </div>

  <!-- Theme toggle script (optional) -->
  <script>
    // Simple theme toggle
    document.addEventListener('DOMContentLoaded', () => {
      const html = document.documentElement;
      const savedTheme = localStorage.getItem('theme') || 'dark';
      html.setAttribute('data-theme', savedTheme);

      // If you have a theme toggle button:
      // document.getElementById('themeToggle').addEventListener('click', () => {
      //   const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      //   html.setAttribute('data-theme', newTheme);
      //   localStorage.setItem('theme', newTheme);
      // });
    });
  </script>
</body>
</html>
